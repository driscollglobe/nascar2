<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Lineup: Stock Car Racing Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* tokens.css: the Two Seats / Lineup design language, inlined verbatim */
:root {
  --bg: #0d1117; --panel: #161c24; --panel2: #1d2530; --raised: #222c38;
  --line: #28323f; --line2: #34404f;
  --text: #eef2f6; --muted: #97a3b3; --faint: #728092;
  --amber: #f2e500; --amber2: #fff44d; --green: #37d99a; --red: #ff5d6c; --cyan: #3fd8e2;
  --display: "Barlow Condensed", "Oswald", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px; --radius-sm: 9px; --gap: 14px; --maxw: 460px;
  --deal-ms: 420ms; --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --check: repeating-conic-gradient(var(--text) 0% 25%, var(--bg) 0% 50%) 0 0 / 12px 12px;
}
@media (prefers-reduced-motion: reduce) { :root { --deal-ms: 0ms; } }

/* app.css: relevant subset, inlined from the daily so it reads as one family */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-height: 1.5;
}
#app {
  max-width: var(--maxw); margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; padding: 0 16px env(safe-area-inset-bottom) 16px;
}
.display { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; }
.grow { flex: 1; } .hidden { display: none !important; }
/* checkered speed strip: checks float on the page (no filled bar), skewed to
   the badge's slash angle, fading out at both ends. */
.checker { position: relative; height: 10px; background: none; border-radius: 0; opacity: 1; }
.checker::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-conic-gradient(rgba(238, 242, 246, 0.85) 0% 25%, transparent 0% 50%);
  background-size: 10px 10px; background-repeat: round;
  transform: skewX(-14deg);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
}
.checker.thin { height: 8px; }
.checker.thin::before { background-size: 8px 8px; opacity: 0.55; }

.btn {
  font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  font-size: 19px; border: 1px solid var(--line2); background: var(--raised); color: var(--text);
  border-radius: var(--radius); padding: 16px 18px; cursor: pointer;
  transition: transform 120ms var(--ease), background 120ms, border-color 120ms, opacity 120ms;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #14110a; }
.btn.primary:hover { background: var(--amber2); }
.btn.sign { background: var(--amber); border-color: var(--amber); color: #14110a; }
.btn.pass { background: transparent; border-color: var(--line2); color: var(--text); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); font-size: 15px; padding: 10px 14px; }
.tag {
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .wordmark { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.04em; }
.brand .dot { color: var(--amber); }
.brand .mode { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: var(--cyan); text-transform: uppercase; }

.benchmark {
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 6px;
}
.benchmark .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.benchmark .org { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; margin: 4px 0 2px; }
.benchmark .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

.statusrow { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
.passes { display: flex; gap: 6px; align-items: center; }
.pip { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line2); }
.pip.spent { background: var(--red); border-color: var(--red); }
.pip.left { background: var(--cyan); border-color: var(--cyan); }

.stage { position: relative; flex: 1; display: grid; place-items: center; min-height: 320px; margin: 8px 0; }

.card {
  width: 100%; max-width: 320px; background: linear-gradient(180deg, var(--raised), var(--panel2));
  border: 1px solid var(--line2); border-radius: 18px; padding: 0; overflow: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}
.card .stripe { height: 10px; background: var(--check); background-size: 10px 10px; background-repeat: round; }
.card .body { padding: 20px 20px 22px; }
.card .driver { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 0.98; margin: 14px 0 2px; }
.card .year { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--muted); }
.card .hide {
  display: flex; align-items: center; justify-content: space-between;
}
/* Border and spacing only once the tier is revealed, so the pre-decision card
   has no empty bordered gap. */
.card.revealed .hide { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.card .hide .q { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--faint); }
.card .hide .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); max-width: 150px; text-align: right; }
.card .tag.team { color: var(--muted); border-color: var(--line2); font-size: 11px; }
.card.dealing { animation: deal var(--deal-ms) var(--ease); }
@keyframes deal { from { opacity: 0; transform: translateY(26px) rotate(-3deg) scale(0.94); } to { opacity: 1; transform: none; } }
.card.leaving { animation: leave 200ms var(--ease) forwards; }
@keyframes leave { to { opacity: 0; transform: translateY(-18px) scale(0.96); } }
.card.revealed .hide .q { transition: color 160ms; }

.lineup { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.lseat {
  display: flex; align-items: center; justify-content: space-between; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel);
  transition: border-color 160ms var(--ease), background 160ms;
}
.lseat.open { border-style: dashed; }
.lseat.filled { border-color: var(--line2); background: var(--panel2); animation: deal 240ms var(--ease); }
.lseat-n { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12.5px; color: var(--muted); }
.lseat-open { font-size: 12px; color: var(--faint); }
.lseat-nm { font-family: var(--display); font-weight: 700; font-size: 18px; }
.lseat-yr { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--cyan); margin-left: 6px; }
.lseat-tier { font-family: var(--display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.lseat-name { display: inline-flex; align-items: baseline; gap: 2px; min-width: 0; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 8px; }
.actions .btn { padding: 18px; font-size: 21px; }
.hintline { text-align: center; font-size: 13px; color: var(--faint); margin: 2px 0 12px; min-height: 16px; }
kbd { font-family: var(--body); font-size: 11px; background: var(--panel2); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--muted); }

.banner { border-radius: var(--radius); padding: 18px; text-align: center; margin: 8px 0; border: 1px solid var(--line2); }
.banner .verdict { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 0.95; }
.banner.victory { background: linear-gradient(180deg, rgba(242,229,0,0.16), var(--panel)); border-color: var(--amber); }
.banner.victory .verdict { color: var(--amber); }
.banner.win { background: linear-gradient(180deg, rgba(55,217,154,0.14), var(--panel)); border-color: var(--green); }
.banner.win .verdict { color: var(--green); }
.banner.miss { background: linear-gradient(180deg, rgba(255,93,108,0.12), var(--panel)); border-color: var(--red); }
.banner.miss .verdict { color: var(--red); }
.banner .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

.section-title {
  font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 14px; color: var(--muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px;
}
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.dynasty { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.dynasty .head { font-size: 13.5px; color: var(--muted); margin-bottom: 0; }
.dynasty .head b { color: var(--text); }

.lede { color: var(--muted); font-size: 14.5px; margin: 10px 0; }
.foot { margin-top: auto; padding: 14px 0; color: var(--faint); font-size: 12.5px; text-align: center; }

@media (min-width: 520px) { .card { max-width: 340px; } }

/* head to head reveal */
.vs { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px 8px; margin: 6px 0 4px; }
.vs-tops { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.vs-top { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vs-top.you { align-items: flex-start; text-align: left; }
.vs-top.them { align-items: flex-end; text-align: right; }
.vs-top .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.vs-top .vs-cap { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin-top: 2px; }
.vs-top .tot { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 0.85; }
.vs-top.you .tot { color: var(--amber); transition: color 200ms; }
.vs-top.them .tot { color: var(--text); }
.vs-top .tot.victory { color: var(--amber); }
.vs-top .tot.win { color: var(--green); }
.vs-top .tot.miss { color: var(--red); }
.vs-x { font-weight: 700; font-size: 14px; color: var(--faint); padding: 0 2px; }
.vs-rows { padding-top: 8px; }
.vs-row { display: grid; grid-template-columns: 1fr 18px 1fr; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(40, 50, 63, 0.5); }
.vs-row:last-child { border-bottom: 0; }
.vs-tick { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); margin: 0 auto; }
.vs-row .cell { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.vs-row .cell.you { justify-content: space-between; }
.vs-row .cell.them { justify-content: space-between; flex-direction: row; }
.vs-row .cell .nm { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs-row .cell.them .nm { text-align: right; }
.vs-row .cell .nm-wrap { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; }
.vs-row .cell .yr { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--cyan); flex: none; }
.vs-row .cell .w { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vs-row .cell .w.lead { color: var(--amber2); }
.vs-row .cell.empty { opacity: 0.25; }
.w.appear, .cell.appear { animation: deal 280ms var(--ease); }

.flag-host { min-height: 0; }
.raceflag { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 34px; text-align: center; padding: 18px 12px; border-radius: var(--radius); margin: 4px 0 10px; animation: flagin 220ms var(--ease); }
.raceflag.out { animation: flagout 240ms var(--ease) forwards; }
.raceflag.green { background: var(--green); color: #06120c; }
.raceflag.checkered { display: flex; flex-direction: column; gap: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); text-shadow: none; }
.raceflag.checkered::before, .raceflag.checkered::after {
  content: ""; display: block; height: 16px; border-radius: 4px; background-color: var(--bg);
  background-image: linear-gradient(45deg, var(--text) 25%, transparent 25%), linear-gradient(-45deg, var(--text) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--text) 75%), linear-gradient(-45deg, transparent 75%, var(--text) 75%);
  background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
@keyframes flagin { from { opacity: 0; transform: translateY(-10px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes flagout { to { opacity: 0; transform: translateY(-8px) scale(0.98); } }

.pct { display: flex; flex-direction: column; gap: 2px; background: rgba(63, 216, 226, 0.08); border: 1px solid rgba(63, 216, 226, 0.3); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; }
.pct-v { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--text); }

/* cross-era badge + sweep panel (prototype-only chrome) */
.era-tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); background: var(--cyan); border-radius: 4px; padding: 2px 6px; }
.sweep { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.sweep h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 14px; margin: 0 0 8px; color: var(--text); }
.sweep .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
.sweep .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; }
.sweep .stat .v { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; }
.sweep .stat .k { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.sweep .verdict-line { font-size: 13.5px; color: var(--text); margin-top: 8px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--panel2); border: 1px solid var(--line); }
.sweep .verdict-line.tense { border-color: var(--green); }
.sweep .verdict-line.trivial { border-color: var(--red); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---------------- games hub ---------------- */
.hub-lede {
  font-family: var(--display); font-weight: 500; font-size: 17.5px; line-height: 1.35;
  letter-spacing: 0.02em; text-transform: uppercase; color: var(--text);
  text-align: center; margin: 14px 0 2px;
}
.hub-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.gamecard {
  text-align: left; background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--line2); border-radius: var(--radius); padding: 16px;
  cursor: pointer; font-family: var(--body); color: var(--text); width: 100%;
  transition: transform 120ms var(--ease), border-color 120ms;
  -webkit-tap-highlight-color: transparent;
}
.gamecard:active { transform: translateY(1px) scale(0.995); }
.gamecard.primary { border-color: var(--amber); background: linear-gradient(180deg, rgba(242, 229, 0, 0.10), var(--panel)); }
.gamecard.soon { opacity: 0.55; cursor: default; }
.gamecard .gc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gamecard .gc-title { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 26px; line-height: 1; }
.gamecard .gc-desc { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.45; }
.gamecard .gc-stat { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; }

/* ---------------- daily grid ---------------- */
.ggrid { display: grid; grid-template-columns: minmax(64px, 88px) repeat(3, 1fr); gap: 6px; margin: 10px 0 6px; }
.ghead {
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--display); font-weight: 600; font-size: 12.5px; line-height: 1.15;
  text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); padding: 6px 2px; min-height: 44px;
}
.ghead.rowhead { text-align: left; justify-content: flex-start; padding-left: 2px; }
.gcell {
  aspect-ratio: 1 / 1; min-height: 72px; border: 1px solid var(--line2); border-radius: var(--radius-sm);
  background: var(--panel2); cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; padding: 4px; color: var(--text);
  font-family: var(--body); -webkit-tap-highlight-color: transparent;
}
.gcell.sel { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(63, 216, 226, 0.25); }
.gcell.ok { border-color: var(--green); background: rgba(55, 217, 154, 0.10); cursor: default; }
.gcell.dead { opacity: 0.45; cursor: default; }
.gcell .gc-nm { font-family: var(--display); font-weight: 700; font-size: 14.5px; line-height: 1.05; text-align: center; }
.gcell .gc-r { font-size: 12px; color: var(--muted); }
.gc-plus { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--faint); }
.gstatus { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 0; }
.gpanel { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); padding: 14px; margin: 8px 0; }
.gpanel .gp-clues { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.25; text-transform: uppercase; }
.gpanel .gp-x { color: var(--amber); padding: 0 6px; }
.ginput {
  width: 100%; margin-top: 10px; font-size: 18px; padding: 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-family: var(--body);
}
.ginput:focus { outline: 2px solid var(--cyan); }
.gsug { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.gsug button {
  text-align: left; font-size: 16px; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--raised); color: var(--text); cursor: pointer; font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.gsug button .yrs { color: var(--muted); font-size: 13px; }
.gfeed { margin: 8px 0; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line2); background: var(--panel); font-size: 14.5px; line-height: 1.45; }
.gfeed.good { border-color: var(--green); }
.gfeed.bad { border-color: var(--red); }
.sharebox {
  white-space: pre-wrap; font-family: var(--body); font-size: 14px; background: var(--panel2);
  border: 1px solid var(--line2); border-radius: var(--radius-sm); padding: 12px; margin: 10px 0;
  user-select: text; -webkit-user-select: text; line-height: 1.5;
}

/* ---------------- streak ---------------- */
.duelq { font-family: var(--display); font-weight: 700; font-size: 30px; text-align: center; margin: 14px 0 2px; line-height: 1; text-transform: uppercase; }
.duelsub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.duel { display: flex; flex-direction: column; gap: 12px; }
.vsline { text-align: center; font-family: var(--display); font-weight: 700; color: var(--faint); font-size: 15px; }
.duelcard {
  position: relative; text-align: left; width: 100%;
  background: linear-gradient(180deg, var(--raised), var(--panel2));
  border: 1px solid var(--line2); border-radius: var(--radius); padding: 20px 96px 20px 16px;
  cursor: pointer; color: var(--text); font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.duelcard:active { transform: translateY(1px); }
.duelcard .dc-nm { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; }
.duelcard .dc-yr { color: #cfd8e3; font-size: 13px; margin-top: 4px; }
.duelcard .dc-w { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-family: var(--display); font-weight: 700; font-size: 40px; }
.duelcard.right { border-color: var(--green); }
.duelcard.right .dc-w { color: var(--green); }
.duelcard.wrong { border-color: var(--red); }
.duelcard.wrong .dc-w { color: var(--red); }
.streakbar { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 0; }
.streakbar .sb-n { font-family: var(--display); font-weight: 700; font-size: 44px; color: var(--amber); line-height: 1; }

/* ---------------- phase two ---------------- */
/* theme accent + allegiance chip on the hub */
.theme-accent { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--cyan); margin: 6px 0 0; }
.alleg-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; flex-wrap: wrap; }
.alleg-chip { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.alleg-chip .lbl { color: var(--amber); }

/* grid streak view on the card */
.gc-streak { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.gc-streak .num { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--amber); }
.gc-jeopardy { color: var(--amber2); font-size: 12.5px; margin-top: 6px; }
.gcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; max-width: 220px; }
.gdot { width: 100%; aspect-ratio: 1 / 1; border-radius: 3px; border: 1px solid var(--line2); background: transparent; }
.gdot.hit { background: var(--green); border-color: var(--green); }
.gdot.mid { background: var(--cyan); border-color: var(--cyan); opacity: 0.7; }
.gdot.today { box-shadow: 0 0 0 2px rgba(242, 229, 0, 0.5); }

/* rarity on a grid cell + rarity score panel */
.gcell .gc-rare { font-size: 10.5px; margin-top: 1px; font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.r-common { color: var(--muted); }
.r-solid { color: var(--cyan); }
.r-deep { color: var(--green); }
.r-garage { color: var(--amber); }
.r-early { color: var(--faint); }
.gcell.garage { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(242, 229, 0, 0.25); }
.rarity-hero { background: linear-gradient(180deg, rgba(242,229,0,0.10), var(--panel)); border: 1px solid var(--amber); border-radius: var(--radius); padding: 14px; margin: 8px 0; }
.rarity-hero .rs-n { font-family: var(--display); font-weight: 700; font-size: 40px; color: var(--amber); line-height: 1; }
.rarity-hero .rs-k { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.rarity-hero .rs-rare { font-size: 13.5px; color: var(--text); margin-top: 8px; }

/* near-miss / full answer reveal */
.answers { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; }
.answers .ans { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); font-size: 13.5px; }
.answers .ans .r { color: var(--muted); font-variant-numeric: tabular-nums; }
.answers .ans.mine { border-color: var(--cyan); background: rgba(63, 216, 226, 0.08); }
.answers .ans.deepest { border-color: var(--amber); }
.answers .ans.deepest .tag-deep { color: var(--amber); font-family: var(--display); font-weight: 600; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.reveal-cell-h { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.reveal-cell-h.miss { color: var(--red); }

/* allegiance standings */
.standings { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); padding: 12px; margin: 8px 0; }
.stand-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius-sm); }
.stand-row .nm { font-family: var(--display); font-weight: 600; font-size: 15px; }
.stand-row .v { font-family: var(--display); font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
.stand-row.me { background: rgba(242, 229, 0, 0.10); }
.stand-row.me .nm { color: var(--amber); }

/* full-screen allegiance prompt */
.alleg-overlay { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding: 24px 4px; }
.alleg-title { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 34px; line-height: 1; margin: 8px 0 4px; }
.alleg-sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.alleg-search input { width: 100%; font-size: 17px; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-family: var(--body); }
.alleg-search input:focus { outline: 2px solid var(--cyan); }
.alleg-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; overflow-y: auto; flex: 1; }
.alleg-item { text-align: left; font-size: 16px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--raised); color: var(--text); cursor: pointer; font-family: var(--body); -webkit-tap-highlight-color: transparent; }
.alleg-item.pin { border-color: var(--line2); }
.alleg-item.sel { border-color: var(--amber); background: rgba(242, 229, 0, 0.08); }
.alleg-pin-h { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); margin: 6px 0 2px; }
.alleg-state { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.alleg-state select { font-size: 15px; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-family: var(--body); }
.share-badge { color: var(--amber); }

/* ---------------- phase three ---------------- */
.gc-weekday { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11.5px; color: var(--cyan); margin-top: 8px; }
.practice-flag { align-self: flex-start; font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; font-size: 11px; color: var(--amber); border: 1px solid var(--amber); border-radius: 999px; padding: 3px 10px; margin: 8px 0 0; }

/* stats modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(6, 9, 13, 0.72); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; }
@media (min-width: 520px) { .modal-overlay { align-items: center; } }
.modal-panel { width: 100%; max-width: var(--maxw); max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px 16px 0 0; padding: 16px 16px 22px; animation: sheetup 220ms var(--ease); }
@media (min-width: 520px) { .modal-panel { border-radius: 16px; } }
@keyframes sheetup { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.modal-title { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 22px; }
.modal-x { background: transparent; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stats-tabs { display: flex; gap: 6px; margin: 6px 0 12px; }
.stats-tab { flex: 1; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12.5px; padding: 9px 4px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel2); color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stats-tab.on { border-color: var(--amber); color: var(--amber); background: rgba(242, 229, 0, 0.08); }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 12px; }
.stats-cell { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
.stats-cell .v { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; }
.stats-cell .k { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
.dist { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.dist-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.dist-row .lbl { width: 34px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.dist-bar { height: 16px; background: var(--cyan); border-radius: 3px; min-width: 3px; }
.dist-bar.hot { background: var(--amber); }
.dist-row .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
.stats-empty { color: var(--faint); font-size: 13.5px; padding: 14px 4px; text-align: center; }
.stats-note { color: var(--faint); font-size: 12px; margin-top: 8px; }

/* archive */
.archive-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.archive-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--raised); color: var(--text); cursor: pointer; font-family: var(--body); -webkit-tap-highlight-color: transparent; text-align: left; }
.archive-item .an { font-family: var(--display); font-weight: 700; font-size: 16px; }
.archive-item .ad { color: var(--muted); font-size: 12px; }
.archive-item .as { font-family: var(--display); font-weight: 700; color: var(--green); }
.archive-flag { align-self: flex-start; font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; font-size: 11px; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 999px; padding: 3px 10px; margin: 8px 0 0; }

/* juice (all suppressed under reduced motion) */
@keyframes cellpop { 0% { transform: scale(0.82); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes cellshake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes shimmer { 0% { box-shadow: 0 0 0 2px rgba(242,229,0,0.0), 0 0 0 rgba(242,229,0,0); } 30% { box-shadow: 0 0 0 3px rgba(242,229,0,0.9), 0 0 26px rgba(242,229,0,0.7); } 100% { box-shadow: 0 0 0 2px rgba(242,229,0,0.25), 0 0 0 rgba(242,229,0,0); } }
@keyframes staggerin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes climbpulse { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-6px) scale(1.12); color: var(--green); } 100% { transform: translateY(0) scale(1); } }
.j-pop { animation: cellpop 260ms var(--ease); }
.j-shake { animation: cellshake 300ms var(--ease); }
.j-shimmer { animation: shimmer 700ms var(--ease); }
.j-climb { animation: climbpulse 360ms var(--ease); }
.j-stagger { animation: staggerin 300ms var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  .modal-panel { animation: none; }
  .j-pop, .j-shake, .j-shimmer, .j-climb, .j-stagger { animation: none !important; }
}

/* ---- Phase Four: daily mission, Garage Sweep, rules, countdown ---- */
.mission-banner { width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0 2px; cursor: pointer; color: var(--text); font-family: var(--body); }
.mission-banner .mb-line { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px; color: var(--cyan); }
.mission-banner .mb-dots { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.mission-banner .mb-dot { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); }
.mission-banner .mb-dot.on { color: #14110a; background: var(--green); border-color: var(--green); }
.mission-banner.swept { border-color: var(--amber); background: linear-gradient(180deg, rgba(242,229,0,0.10), var(--panel2)); }
.mission-banner .mb-sweep { margin-top: 8px; font-family: var(--display); font-weight: 700; letter-spacing: 0.06em; font-size: 13px; color: var(--amber); }
.mission-next { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; }
.sweep-badge { display: flex; align-items: center; gap: 12px; background: linear-gradient(180deg, rgba(242,229,0,0.12), var(--panel)); border: 1px solid var(--amber); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0 2px; }
.sweep-badge .sb-emoji { font-size: 26px; }
.sweep-badge .sb-t { font-family: var(--display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); font-size: 15px; }
.sweep-badge .sb-d { font-size: 13px; color: var(--muted); }
.sweep-stat { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--radius-sm); padding: 8px 12px; margin: 2px 0 12px; font-size: 14px; color: var(--text); }
.sweep-stat .ss-emoji { font-size: 16px; }
.sweep-stat .ss-n { font-family: var(--display); font-weight: 700; color: var(--amber); font-size: 18px; }
.stats-alleg { width: 100%; margin-top: 14px; }
.countdown { text-align: center; font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12.5px; color: var(--muted); margin: 10px 0 2px; }
.hub-countdown { margin-top: 14px; }
.rules-btn { font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; color: var(--muted); background: transparent; border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rules-btn:hover { color: var(--text); border-color: var(--line2); }
.rules-game { font-family: var(--display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cyan); font-size: 14px; margin-top: 4px; }
.rules-copy { font-size: 15.5px; line-height: 1.5; color: var(--text); margin-top: 8px; }
.rules-eg { pointer-events: none; opacity: 0.95; }
.alleg-offer { width: 100%; }

/* ---- beta feedback round: progress hub, newsletter, reveal grid, labels ---- */
.mission-banner.status { cursor: default; }
.gamecard.played { opacity: 0.82; }
.gamecard.played.primary { border-color: var(--line2); background: var(--panel); }
.gamecard.played::after { display: none; }
.gc-check { font-family: var(--display); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; color: var(--green); border: 1px solid var(--green); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.ladder-desc { text-align: center; color: var(--muted); font-size: 13.5px; margin: 6px 0 2px; }
.ladder-timer { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; }
.ladder-timer .lt-track { flex: 1; height: 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line2); overflow: hidden; }
.ladder-timer .lt-bar { height: 100%; width: 100%; background: var(--cyan); border-radius: 999px; }
.ladder-timer .lt-bar.low { background: var(--red); }
.ladder-timer .lt-num { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--cyan); min-width: 26px; text-align: right; }
.ladder-timer .lt-num.low { color: var(--red); }
.grid-legend { font-size: 12.5px; line-height: 1.4; color: var(--muted); margin: 10px 0 2px; }
.newsletter { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 11px 14px; border: 1px solid var(--line2); border-radius: var(--radius-sm); background: var(--panel2); }
.newsletter .nl-link { color: var(--cyan); font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 13px; text-decoration: none; }
.newsletter .nl-link:hover { text-decoration: underline; }
.newsletter .nl-x { background: transparent; border: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; cursor: pointer; }
.motorsport-link { text-align: center; margin-top: 12px; }
.motorsport-link .ms-link { color: var(--muted); font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; text-decoration: none; }
.motorsport-link .ms-link:hover { color: var(--cyan); text-decoration: underline; }
/* Completed-grid hero: revealed boxes read distinctly from the player's own. */
.ggrid.done .gcell.reveal { background: var(--panel); border-color: var(--line2); opacity: 0.92; }
.ggrid.done .gcell.reveal .gc-nm { color: var(--muted); }
.gcell .gc-shown { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-top: 2px; }
/* Race Picks (Mode Four) */
.pickstack { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.pickrow {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text);
  cursor: pointer; font: inherit; font-size: 13.5px;
}
.pickrow:hover { border-color: var(--line2); }
.pickrow .pr-car { color: var(--faint); font-size: 12px; margin-left: 6px; }
.pickrow .pr-org { display: block; color: var(--muted); font-size: 12.5px; }
.pickrow .pr-tag { font-family: var(--display); font-size: 12px; letter-spacing: 0.08em; white-space: nowrap; }
.pickrow.win { border-color: var(--amber); background: linear-gradient(180deg, rgba(242, 229, 0, 0.1), var(--panel)); }
.pickrow.win .pr-tag { color: var(--amber); }
.pickrow.sel { border-color: var(--cyan); }
.pickrow.sel .pr-tag { color: var(--cyan); }
.picks-count { font-family: var(--display); font-size: 13px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
/* ============================================================
   HUB DESIGN PASS: the Two Seats design standard. Keyframes
   dealIn, flip and dealpulse are ported verbatim from Two Seats.
   ============================================================ */
@keyframes dealIn{from{opacity:0;translate:0 -42px}to{opacity:1;translate:0 0}}
@keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(86deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}
@keyframes dealpulse{0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(242,229,0,.18)}50%{transform:scale(1.03);box-shadow:0 10px 30px rgba(242,229,0,.42)}}
.card.flip{animation:flip .38s ease}
.btn.pulse,.welcome-cta.pulse{animation:dealpulse 2s ease-in-out infinite}
.dealin{opacity:0;animation:dealIn .3s cubic-bezier(.2,.7,.3,1) forwards}
.card.dealing{opacity:0;animation:dealIn .3s cubic-bezier(.2,.7,.3,1) forwards}
@media (prefers-reduced-motion: reduce){
  .card.flip,.btn.pulse,.welcome-cta.pulse{animation:none}
  .dealin,.card.dealing{animation:none;opacity:1}
}

/* header brand: the Two Seats ghead construction, centered */
.ghead2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 2px 8px}
.brandlogo{height:20px;width:auto;display:block;color:var(--text)}
.presents{font-family:var(--body);font-size:14px;line-height:1;color:var(--muted);letter-spacing:.02em;margin-top:9px}
.lineup-logo{display:block;height:auto;width:min(250px,64%);margin:14px auto 0}
.kick{font-family:var(--display);font-size:12px;letter-spacing:.26em;color:var(--amber);text-transform:uppercase;font-weight:700;margin-top:16px}
.welcome-box .lineup-logo{margin-top:0}

/* first-run welcome, the Two Seats .mbox.welcome construction */
.welcome-overlay{position:fixed;inset:0;background:rgba(6,9,14,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:70}

.welcome-box .lineup-logo{width:min(210px,60%);margin:2px auto 18px}

.wc-card:hover{border-color:var(--amber)}
.wc-card:active{transform:translateY(1px) scale(0.995)}

/* laptop: the phone-first 460px column relaxes; layouts are fluid so nothing
   else changes. The welcome matches Two Seats' desktop width. */

}
.wc-name{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.wc-desc{font-size:14px;line-height:1.5;color:#cfd6de;margin-top:3px}

<body>
<div id="app"></div>

<!-- Inlined dataset: copied verbatim from the built index.html (window.__LINEUP_DATA__). -->
<script>window.__LINEUP_DATA__ = {"_meta": @@DATA:lineup_meta@@, "orgSeasons": @@DATA:org_seasons@@, "driverPool": @@DATA:driver_pool@@};</script>

<!-- Shared layer for all three modes: canonical display names and a minimal
     analytics event layer. Loaded before the mode scripts so both the
     Cross-Era closure and the hub closure can read the same table. -->
<script>
(function () {
"use strict";

/* =========================================================================
   Canonical display names (window.__LINEUP_CANON__).

   One table, used by every mode at render time. It never mutates the
   underlying datasets; it only maps a raw dataset string to the name shown
   on screen. Keys are whitespace-normalized (non-breaking spaces collapsed,
   runs of space collapsed, ends trimmed), so a single entry covers a name
   however it is stored across the three datasets.

   Two groups:
     1. Editor-specified canonical forms (legal names, nickname forms,
        missing-period suffixes) listed in the launch spec.
     2. Auto-detected legal-name expansions found by scanning the datasets:
        a middle name wedged into an otherwise ordinary first-plus-last
        name. Normalized mechanically (drop the middle token) and called out
        in the editorial handoff for a human to confirm the preferred public
        form. No name is guessed from outside the data.
   ========================================================================= */
  function normKey(s) {
    return String(s == null ? "" : s).replace(/ /g, " ").replace(/\s+/g, " ").trim();
  }
  // value: { full } and optionally { short } when the dataset short form is wrong.
  var CANON = {
    "Dale Arnold Jarrett": { full: "Dale Jarrett" },
    "Joseph Joe Frank Nemechek III": { full: "Joe Nemechek", short: "Joe Nemechek" },
    "Alan Dennis Kulwicki": { full: "Alan Kulwicki" },
    "Darrell Bubba Wallace Jr.": { full: "Bubba Wallace" },
    "Kenneth Dale Irwin Jr.": { full: "Kenny Irwin Jr." },
    "Dale Earnhardt Jr": { full: "Dale Earnhardt Jr." },
    "Martin Truex Jr": { full: "Martin Truex Jr." },
    "Ricky Stenhouse Jr": { full: "Ricky Stenhouse Jr." },
    // Auto-detected legal-name expansions (flagged for editorial review).
    "David Ray Boggs": { full: "David Boggs" },
    "Harold Bruce Jacobi": { full: "Harold Jacobi" }
  };
  function localSurname(full) {
    var t = String(full).trim().split(/\s+/);
    while (t.length > 1 && /^(II|III|IV|V)$/i.test(t[t.length - 1])) t.pop();
    var last = t[t.length - 1];
    if (t.length > 1 && /^(Jr|Sr)\.?$/i.test(last)) return t[t.length - 2] + " " + last.replace(/\.$/, "");
    return last;
  }
  function canonFull(raw) {
    var key = normKey(raw);
    var e = CANON[key];
    return e ? e.full : key;
  }
  // Short form for tight spots (grid cells): prefer the dataset short unless
  // the table overrides it (only where the dataset short is broken).
  function canonShort(raw, dsp) {
    var e = CANON[normKey(raw)];
    if (e && e.short) return e.short;
    return dsp || localSurname(canonFull(raw));
  }
  window.__LINEUP_CANON__ = { name: canonFull, short: canonShort, normKey: normKey, table: CANON };

/* =========================================================================
   Venue rename canonicalization (window.VENUE_CANON).

   MSS records a physical track under whatever name was current at the time, so
   one facility can appear under several names across eras (Phoenix
   International Raceway / ISM Raceway / Phoenix Raceway). Left alone this breaks
   track clues both ways: a retired name shown as the clue can read wrong, and a
   "won at N tracks" threshold could count one facility more than once.

   RULES (conservative):
     - Merge ONLY documented renames of the SAME physical facility.
     - NEVER merge distinct facilities that share a city or a similar name.
       When in any doubt, do not merge (see the change log NEEDS HUMAN REVIEW).
     - display is the track's current public name. Clue text renders display;
       matching accepts every alias.

   In the current MSS pull every facility appears under exactly ONE name, so
   there are ZERO facility-merges to make. Three venues are recorded under a
   retired name and are given their current public display name (recorded name
   kept as an alias so matching is unaffected). Each mapping's comment states the
   documented rename it reflects. Editorial confirms the table via the QA export;
   their sign-off is the completeness gate. Full venue list and the review
   candidates (Gateway/WWT, IMS oval vs road course) are in the change log. */
  var VENUE_CANON = {
    // Phoenix International Raceway -> ISM Raceway (2018) -> Phoenix Raceway (2021).
    "ISM Raceway": { display: "Phoenix Raceway", aliases: ["ISM Raceway"] },
    // Dover International Speedway -> Dover Motor Speedway (2022).
    "Dover International Speedway": { display: "Dover Motor Speedway", aliases: ["Dover International Speedway"] },
    // Richmond International Raceway -> Richmond Raceway (2018).
    "Richmond International Raceway": { display: "Richmond Raceway", aliases: ["Richmond International Raceway"] }
  };
  function venueDisplay(raw) { var e = VENUE_CANON[raw]; return e ? e.display : raw; }
  // Canonical identity for dedup: same facility resolves to the same key.
  function venueKey(raw) { var e = VENUE_CANON[raw]; return e ? e.display : raw; }
  window.__LINEUP_VENUE__ = { table: VENUE_CANON, display: venueDisplay, key: venueKey };

/* =========================================================================
   Org display aliases (window.__LINEUP_ORG__).

   Same shape and rules as the venue canon: MSS records a team under its
   historical name, so a renamed org can read stale on current-season
   surfaces. display is the org's current public name, applied at RENDER
   TIME ONLY on current-season surfaces (Race Picks); matching, stored data
   and historical season cards are untouched, so a 2006 Roush Fenway card
   still reads as its era. Only documented renames of the SAME organization
   belong here.
   ========================================================================= */
  var ORG_ALIAS = {
    // Roush Fenway Racing -> RFK Racing (2022).
    "Roush Fenway Racing": "RFK Racing"
  };
  function orgDisplay(raw) { return ORG_ALIAS[raw] || raw; }
  window.__LINEUP_ORG__ = { table: ORG_ALIAS, display: orgDisplay };

  // Public game URL, appended to every share string across all three modes.
  // Single source of truth: change this one line to repoint every share.
  window.__LINEUP_URL__ = "https://driscollglobe.github.io/nascar2/";

  // Optional newsletter signup. A human supplies the real URL here. Empty by
  // default, which hides the "Get The Lineup daily" module everywhere. The game
  // never collects an email itself and nothing is ever gated behind signup.
  window.LINEUP_NEWSLETTER_URL = "";

  // Optional outbound link to the parent racing site (beta feedback: "a way to
  // go to motorsport"). A human supplies the real URL. Empty by default, which
  // hides the footer link everywhere. (The related "same for 2seats" note was
  // ambiguous and is left for product to clarify; nothing invented here.)
  window.LINEUP_MOTORSPORT_URL = "";

  // Persistent legal disclaimer, shown in the footer on the hub and in every
  // mode. One source of truth so the wording stays identical everywhere.
  window.__LINEUP_LEGAL__ = "Unofficial fan game. Not affiliated with or endorsed by NASCAR, its teams, drivers or sponsors. Names and statistics are used for informational and entertainment purposes.";

/* =========================================================================
   Analytics event layer (window.track).

   A single track(eventName, props) call that pushes one flat object to
   window.dataLayer when a container is present, and does nothing otherwise.
   Editorial can wire Google Tag Manager against these event names with no
   code change here. No cookies, no personal data, no device fingerprint;
   only the named events below are ever fired.
   ========================================================================= */
  window.track = function (eventName, props) {
    try {
      if (!window.dataLayer || typeof window.dataLayer.push !== "function") return;
      var payload = { event: eventName };
      if (props) {
        for (var k in props) {
          if (Object.prototype.hasOwnProperty.call(props, k)) payload[k] = props[k];
        }
      }
      window.dataLayer.push(payload);
    } catch (e) {}
  };

/* =========================================================================
   Storage schema version (shared). Phase Two bumps this to 3. All persisted
   keys live under this namespace, and the hub migrates launch-build (v2)
   keys forward on boot so no player loses their streak or best.
   ========================================================================= */
  window.__LINEUP_DATA_VERSION__ = 6;
  window.__LINEUP_NS__ = "lineupHub:v6:";

/* =========================================================================
   THEME_CALENDAR (editor block, edit like the data blocks).

   Maps UTC date ranges to a season theme. A theme is an INPUT to the seeded
   generators, never an override: the seed still fully determines the day, so
   every player gets the identical puzzle. A theme only nudges which clues and
   which real teams are more likely to appear.

   Fields per entry:
     from, to      inclusive UTC day range, "YYYY-MM-DD".
     label         short accent shown on the hub, e.g. "Darlington week".
     gridBias      array of substrings; grid clues whose label contains any of
                   them are weighted to appear more often. Uses only tracks and
                   orgs already in the datasets.
     crossEraBias  optional weighting for the daily Cross-Era matchup, using
                   only verifiable org-season fields: {minBenchmark} leans to
                   dynasties, {orgIncludes:[...]} to named teams, {yearFrom,
                   yearTo} to an era. Track-to-team history is NOT in the
                   org-season data, so track weeks lean dynasty here and get
                   their track flavor in the Grid. Never invented.
     accentNote    editor note, not shown to players.

   DATES BELOW ARE EDITOR PLACEHOLDERS anchored to the September 2, 2026 epoch.
   Set them to the real 2026 schedule; nothing here asserts a race date as fact.
   ========================================================================= */
  var THEME_CALENDAR = [
    { from: "2026-09-02", to: "2026-09-08", label: "Darlington week",
      gridBias: ["Darlington"], crossEraBias: { minBenchmark: 12 },
      accentNote: "Playoff opener. Grid leans Darlington winners, Cross-Era leans dynasties." },
    { from: "2026-09-16", to: "2026-09-22", label: "Bristol week",
      gridBias: ["Bristol"], crossEraBias: null,
      accentNote: "Short-track night race flavor." },
    { from: "2026-09-30", to: "2026-10-06", label: "Talladega week",
      gridBias: ["Talladega"], crossEraBias: null,
      accentNote: "Superspeedway week." },
    { from: "2026-10-21", to: "2026-10-27", label: "Martinsville week",
      gridBias: ["Martinsville"], crossEraBias: null,
      accentNote: "Round of 8 short track." },
    { from: "2026-11-04", to: "2026-11-10", label: "Champion week",
      gridBias: ["Won 30 or more", "Won 10 or more"], crossEraBias: { minBenchmark: 12 },
      accentNote: "Title-deciding week. Leans to the biggest winners and dynasties." }
  ];
  function themeForDay(dayStr) {
    for (var i = 0; i < THEME_CALENDAR.length; i++) {
      var t = THEME_CALENDAR[i];
      if (dayStr >= t.from && dayStr <= t.to) return t;
    }
    return null;
  }
  window.__LINEUP_THEME__ = { forDay: themeForDay, calendar: THEME_CALENDAR };

/* =========================================================================
   Shared UTC day key (window.__LINEUP_DAY__). One source of truth for the
   daily rollover so the hub and the Cross-Era closure never drift. Midnight
   UTC boundary; ?date=YYYY-MM-DD overrides "today" for past-day debugging.
   ========================================================================= */
  function overrideDateMs() {
    var m = /[?&]date=(\d{4})-(\d{2})-(\d{2})/.exec(location.search);
    if (!m) return null;
    var ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    return isNaN(ms) ? null : ms;
  }
  function dayMs() {
    var o = overrideDateMs();
    if (o != null) return o;
    var d = new Date();
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  function dayKeyStr() {
    var d = new Date(dayMs());
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  window.__LINEUP_DAY__ = { ms: dayMs, key: dayKeyStr };

/* =========================================================================
   Weekday difficulty curve for the Grid (window.__LINEUP_WEEKDAY__). NYT
   crossword logic, deterministic by UTC weekday: Monday and Tuesday lean easy,
   Friday and Saturday lean hard, the rest are standard. This is a weighting
   INPUT to the seeded generator (it only selects among already-valid grids by
   their median cell answer count), so the seed still fully determines the day
   and it composes with the theme calendar rather than replacing it. To adjust
   the curve, change the mapping below; the sweep (verify.js check H) reports
   the resulting per-weekday distribution.
   ========================================================================= */
  function weekdayIndex(dayStr) {
    var ms = Date.parse(dayStr + "T00:00:00Z");
    return isNaN(ms) ? 3 : new Date(ms).getUTCDay(); // 0 Sun ... 6 Sat
  }
  function weekdayDifficulty(dayStr) {
    var w = weekdayIndex(dayStr);
    if (w === 1 || w === 2) return "easy";      // Mon, Tue
    if (w === 5 || w === 6) return "hard";      // Fri, Sat
    return "standard";                          // Wed, Thu, Sun
  }
  // Short hub line, a few words, no dashes. Standard days get no extra line.
  var WEEKDAY_LABEL = {
    1: "Monday grid. Easy roll.",
    2: "Tuesday grid. Roll on.",
    5: "Friday grid. Bring it.",
    6: "Saturday grid. Tough one."
  };
  function weekdayLabel(dayStr) { return WEEKDAY_LABEL[weekdayIndex(dayStr)] || null; }
  window.__LINEUP_WEEKDAY__ = { forDay: weekdayDifficulty, label: weekdayLabel };

/* =========================================================================
   Driver allegiance store (window.__LINEUP_ALLEGIANCE__).

   A single locally-stored choice: your driver. Set from the hub chip, from
   Stats, or offered after the first completed game (never a first-visit wall).
   Home state was removed for launch. Never read from the browser beyond the
   explicit selection; no location inference. The chosen driver is sent with
   answer POSTs so the aggregation service can group standings.
   ========================================================================= */
  var CANON2 = window.__LINEUP_CANON__;
  function allegKey() { return window.__LINEUP_NS__ + "allegiance"; }
  function lsGetRaw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSetRaw(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function allegGet() {
    try { return JSON.parse(lsGetRaw(allegKey()) || "null") || null; } catch (e) { return null; }
  }
  function allegSet(obj) { lsSetRaw(allegKey(), JSON.stringify(obj || {})); }
  // "Team Earnhardt" style label: last non-suffix name token.
  function teamLabel(driver) {
    if (!driver) return "";
    var t = String(driver).trim().split(/\s+/);
    while (t.length > 1 && /^(Jr|Sr|II|III|IV|V)\.?$/i.test(t[t.length - 1])) t.pop();
    return t[t.length - 1] || String(driver);
  }
  var CURATED = [
    "Dale Earnhardt Sr.", "Jeff Gordon", "Richard Petty", "Dale Earnhardt Jr.",
    "Jimmie Johnson", "Bill Elliott", "Darrell Waltrip", "Rusty Wallace",
    "Tony Stewart", "Kyle Busch", "Chase Elliott", "Kyle Larson", "Denny Hamlin"
  ];
  // Built lazily so all datasets have loaded. Winners come from the Grid facts
  // (canonical display names), plus the curated shortlist pinned on top.
  function allegDriverList() {
    var pinned = CURATED.slice();
    var pinnedSet = {}; pinned.forEach(function (n) { pinnedSet[n] = 1; });
    var seen = {}; var rest = [];
    var GF = window.__GRID_FACTS__ || { drivers: [] };
    (GF.drivers || []).forEach(function (dr) {
      if (dr.w >= 1) {
        var nm = CANON2.name(dr.n);
        if (!pinnedSet[nm] && !seen[nm]) { seen[nm] = 1; rest.push(nm); }
      }
    });
    rest.sort(function (a, b) { return a.localeCompare(b); });
    return { pinned: pinned, rest: rest };
  }
  window.__LINEUP_ALLEGIANCE__ = {
    get: allegGet, set: allegSet, teamLabel: teamLabel,
    driverList: allegDriverList, curated: CURATED
  };

/* =========================================================================
   Aggregation API client (window.__LINEUP_API__).

   The one sanctioned network dependency. Strict graceful degradation: every
   call resolves (never rejects), times out at 2 seconds, and returns null on
   any error or when no API_BASE is configured. Rarity UI renders only when a
   non-null stats object actually arrives, so a dead or missing backend leaves
   the game behaving exactly as the launch build did.

   API_BASE: set this one constant to the deployed Cloudflare Worker origin,
   for example "https://the-lineup-agg.example.workers.dev". Empty string means
   the backend is off and no rarity or standings UI appears anywhere.
   ========================================================================= */
  window.__LINEUP_API_BASE__ = "";
  var API = (function () {
    var TIMEOUT_MS = 2000;
    var sessionToken = null; // signed, short-lived, no identity; from first POST
    function base() { return window.__LINEUP_API_BASE__ || ""; }
    function enabled() { return !!base(); }
    function fetchJSON(url, opts) {
      if (!enabled() || typeof fetch !== "function") return Promise.resolve(null);
      var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
      var o = opts || {};
      if (ctrl) o.signal = ctrl.signal;
      return fetch(url, o).then(function (r) {
        clearTimeout(timer);
        if (!r || !r.ok) return null;
        return r.json().then(function (j) { return j; }, function () { return null; });
      }).catch(function () { clearTimeout(timer); return null; });
    }
    function postAnswer(body) {
      if (!enabled()) return Promise.resolve(null);
      var headers = { "Content-Type": "application/json" };
      if (sessionToken) headers["X-Lineup-Token"] = sessionToken;
      return fetchJSON(base() + "/v1/answer", {
        method: "POST", headers: headers, body: JSON.stringify(body || {})
      }).then(function (j) {
        if (j && j.token) sessionToken = j.token;
        return j;
      });
    }
    function getStats(day, mode) {
      if (!enabled()) return Promise.resolve(null);
      var headers = {};
      if (sessionToken) headers["X-Lineup-Token"] = sessionToken;
      var url = base() + "/v1/stats?day=" + encodeURIComponent(day) + "&mode=" + encodeURIComponent(mode);
      return fetchJSON(url, { method: "GET", headers: headers });
    }
    return { enabled: enabled, postAnswer: postAnswer, getStats: getStats, base: base, hasToken: function () { return !!sessionToken; } };
  })();
  window.__LINEUP_API__ = API;
})();
</script>

<script>
(function () {
"use strict";

/* =========================================================================
   The Lineup. Cross-Era (Mode Two).

   This is the existing DAILY engine with exactly ONE change: the card pack is
   drawn from ALL eras of driverPool, not era-matched to the target's season.
   Everything else (seats, limited passes, sign/pass one at a time, hidden
   tiers revealed on the decision, the head-to-head reveal, the win/Victory
   Lane outcome) is copied from the daily so it reads as the same family.

   Free-play: a "New matchup" button rerolls a fresh real benchmark and a fresh
   cross-era pack. No date lock, no leaderboard, no streak, no persistence.

   NOTE on the anchor/POACH: in the daily that mechanic exists only because the
   pack is era-scarce (the field of same-season rivals can be too weak to win, so
   one roster driver is loaned in). Cross-era the whole field of all-time seasons
   is always available, so the anchor is never needed and is dropped here.
   ========================================================================= */

  var DATA = window.__LINEUP_DATA__;
  if (!DATA) { document.getElementById("app").textContent = "Dataset failed to inline."; return; }
  var ORG_SEASONS = DATA.orgSeasons;
  var POOL = DATA.driverPool;

  var DEV = /[?&]dev=1/.test(location.search);
  // Phase Four QA gate (mirrors the hub): solution-capable inspection hooks are
  // attached only under dev=1 or a global LINEUP_QA, so the public build exposes
  // no window path to a matchup's solver internals.
  var QA = DEV || !!(window.LINEUP_QA || window.__LINEUP_QA__);
  var GAME_URL = window.__LINEUP_URL__ || "";
  var CANON = window.__LINEUP_CANON__ || { name: function (s) { return String(s); }, short: function (s, d) { return d || String(s); } };
  // Canonical display name for any driver, resolved at render time only.
  function dn(name) { return CANON.name(name); }
  // Phase Four cross-closure services, provided by the hub script. That script
  // is a LATER <script> block, so these are not available when this closure is
  // first evaluated. They are resolved lazily (refreshServices) at enter() time,
  // by which point the hub script has run and the hooks exist.
  var MISSION = null, RULES = null, COUNTDOWN = null;
  function refreshServices() {
    MISSION = window.__LINEUP_MISSION__ || null;
    RULES = window.__LINEUP_RULES__ || null;
    COUNTDOWN = window.__LINEUP_COUNTDOWN__ || null;
  }
  function shareURL() { return (window.__LINEUP_SHARE_URL__ ? window.__LINEUP_SHARE_URL__("crossera") : GAME_URL); }
  // Phase Two shared services.
  var API = window.__LINEUP_API__ || { enabled: function () { return false; }, postAnswer: function () { return Promise.resolve(null); }, getStats: function () { return Promise.resolve(null); } };
  var THEME = window.__LINEUP_THEME__ || { forDay: function () { return null; } };
  var ALLEGIANCE = window.__LINEUP_ALLEGIANCE__ || { get: function () { return null; }, teamLabel: function () { return ""; } };
  var DAY = window.__LINEUP_DAY__ || { key: function () { var d = new Date(); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); } };

  /* ---------------- config (copied from src/config.js) ---------------- */
  var PACK = {
    minSize: 6, maxSize: 10, extra: 3,
    dynastyWins: 12, passesDynasty: 4, passesBeatable: 5,
  };
  var MIN_BENCHMARK = 9;   // cross-era floor: 8-win targets were a soft-target glut (266 of 1000 sweep days)
  var VICTORY_MARGIN = 3;

  /* ---------------- rng (copied from src/game/rng.js) ---------------- */
  function hashString(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFromSeed(seedStr) { return mulberry32(hashString(seedStr)); }
  function shuffle(arr, rng) {
    var out = arr.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  /* ---------------- career marks (design pass) ----------------
     Championship counts VERIFIED from MSS season final standings (position 1
     in seasonDriverRanking, seasons 1957 and 1961 through 2025; MSS serves no
     final ranking for 1949 to 1956 or 1958 to 1960, so titles from those years
     are not counted here). Every draftable card season is 1983 or later, so no
     driver who can appear on a card is undercounted by that gap. Regenerate
     with scripts/pull_mss.py champions. Keys are canonical display names. */
  var CHAMPIONS = {
    "Dale Earnhardt Sr.": 7, "Jimmie Johnson": 7, "Richard Petty": 7,
    "Jeff Gordon": 4,
    "Cale Yarborough": 3, "Darrell Waltrip": 3, "David Pearson": 3, "Joey Logano": 3, "Tony Stewart": 3,
    "Joe Weatherly": 2, "Kyle Busch": 2, "Kyle Larson": 2, "Terry Labonte": 2,
    "Alan Kulwicki": 1, "Benny Parsons": 1, "Bill Elliott": 1, "Bobby Allison": 1, "Bobby Isaac": 1,
    "Bobby Labonte": 1, "Brad Keselowski": 1, "Buck Baker": 1, "Chase Elliott": 1, "Dale Jarrett": 1,

  /* ---------------- naive strategies (for the difficulty check) ----------------
     "Sign the biggest names" models a fan who drafts by reputation, not by the
     hidden current-season win count. The seats most-famous drivers in a pack are
     the player's targets; they pass lesser names to hold seats for those targets,
     but the limited pass budget can force their hand. This is the cross-era
     trivialization worry made concrete: famous names, random dealt seasons.     */
  function nameChaserDraft(pack, seats, passes) {
    var ranked = pack.map(function (c) { return { driver: c.driver, fame: fameOf(c.driver) }; })
      .sort(function (a, b) { return b.fame - a.fame; });
    var targets = new Set(ranked.slice(0, seats).map(function (o) { return o.driver; }));
    var seatsLeft = seats, passesLeft = passes, signed = [];
    for (var i = 0; i < pack.length && seatsLeft > 0; i++) {
      var card = pack[i];
      var cardsAfter = pack.length - (i + 1);
      var canPass = passesLeft > 0 && cardsAfter >= seatsLeft;
      var want = targets.has(card.driver);
      var sign = want || !canPass;
      if (sign) { signed.push(card); seatsLeft--; targets.delete(card.driver); }
      else passesLeft--;
    }
    return signed;
  }
  function randomDraft(pack, seats, passes, rnd) {
    var seatsLeft = seats, passesLeft = passes, signed = [];
    for (var i = 0; i < pack.length && seatsLeft > 0; i++) {
      var cardsAfter = pack.length - (i + 1);
      var canPass = passesLeft > 0 && cardsAfter >= seatsLeft;
      var sign = !canPass || rnd() < 0.5;
      if (sign) { signed.push(pack[i]); seatsLeft--; } else passesLeft--;
    }
    return signed;
  }

  // The difficulty check the prototype is meant to surface. Fresh benchmark + fresh
  // cross-era pack each iteration, deterministic by seed so it is reproducible.
  function runSweep(n) {
    n = n || 200;
    var targets = ORG_SEASONS.filter(function (o) { return o.benchmarkWins >= MIN_BENCHMARK && o.seats >= 2; });
    var pickRng = mulberry32(hashString("crossera-sweep-v1"));
    var chaserWins = 0, chaserVL = 0, randWins = 0, optWins = 0, unwinnable = 0, repaired = 0;
    var benchSum = 0, chaserTotalSum = 0, chaserMarginSum = 0;
    var benchDist = {};
    for (var k = 0; k < n; k++) {
      var os = targets[Math.floor(pickRng() * targets.length)];
      var seed = "sweep|" + k + "|" + os.id;
      var run = buildCrossEraRun(os, seed);
      if (!run.winnable) unwinnable++;
      if (run.repaired) repaired++;
      var chaser = scoreRun(nameChaserDraft(run.pack, run.seats, run.passes), os);
      var rnd = mulberry32(hashString(seed + "|rnd"));
      var random = scoreRun(randomDraft(run.pack, run.seats, run.passes, rnd), os);
      if (chaser.win) chaserWins++;
      if (chaser.victoryLane) chaserVL++;
      if (random.win) randWins++;
      if (run.maxOrdered >= os.benchmarkWins) optWins++;
      benchSum += os.benchmarkWins; chaserTotalSum += chaser.total; chaserMarginSum += chaser.diff;
      benchDist[os.benchmarkWins] = (benchDist[os.benchmarkWins] || 0) + 1;
    }
    return {
      n: n,
      chaserWinRate: chaserWins / n,
      chaserVictoryLaneRate: chaserVL / n,
      randomWinRate: randWins / n,
      optimalWinRate: optWins / n,
      avgBenchmark: benchSum / n,
      avgChaserTotal: chaserTotalSum / n,
      avgChaserMargin: chaserMarginSum / n,
      unwinnable: unwinnable, repaired: repaired,
      playableTargets: targets.length, totalTargets: ORG_SEASONS.length,
      benchDist: benchDist,
    };
  }

    if (!tokens.length) return String(name);
    var last = tokens[tokens.length - 1];
    if (tokens.length > 1 && /^(Jr|Sr)\.?$/i.test(last)) return tokens[tokens.length - 2] + " " + last.replace(/\.$/, "");
    return last;

    if (!p || !pickList(p).length) {
      return el("div", { class: "lede", style: "margin-top:12px", text: "No picks this week. The next race opens after results land." });
    }
    var rows = pickList(p).map(function (name, i) {
      return el("div", { class: "ans mine" }, [
        el("span", {}, [
          el("span", { text: dn(name) }),
          i === 0 ? el("span", { class: "tag-deep", text: "  Winner call" }) : null,
        ]),
        el("span", { class: "r", text: "Locked" }),
      ]);
    });
    return el("div", {}, [
      el("div", { class: "section-title", text: "Your picks" }),
      el("div", { class: "answers" }, rows),
      el("div", { class: "lede", style: "font-size:12.5px", text: "Picks are locked for this race. Scores land with Monday's results." }),
    ]);
  }
  function shareText(week) {
    var s = week.score;
    var em = s.rows.map(function (r) {
      return r.pos && r.pos <= 5 ? "🟩" : r.pos && r.pos <= 10 ? "🟨" : "⬛";
    }).join("");
    var lines = [
      "THE LINEUP: RACE PICKS",
      raceDisplay(week.race),
      (s.winnerHit ? "Called the winner. " : "") + "This week: " + s.total + (s.total === 1 ? " point." : " points.") + " Season: " + seasonTotal() + ".",
      em,
    ];
    var badge = window.__LINEUP_BADGE__ ? window.__LINEUP_BADGE__() : "";
    return lines.join("\n") + badge + "\n" + shareURL();
  }
  function scoreCard(week, isFinal) {
    var s = week.score;
    var cls = s.winnerHit ? "victory" : s.total > 0 ? "win" : "miss";
    var sub = raceDisplay(week.race) + ". " + (s.winnerHit ? "You called the winner." : s.total > 0 ? "Points on the board." : "Shut out this week.");
    var rows = s.rows.map(function (r) {
      return el("div", { class: "ans" + (r.pts > 0 ? " mine" : "") }, [
        el("span", {}, [
          el("span", { text: dn(r.name) }),
          r.winnerCall ? el("span", { class: "tag-deep", text: "  Winner call" }) : null,
        ]),
        el("span", { class: "r", text: (r.pos ? "P" + r.pos : "no finish recorded") + (r.pts > 0 ? " · +" + r.pts : "") }),
      ]);
    });
    var share = shareText(week);
    var copyBtn = el("button", { class: "btn primary", text: "Copy share text" });
    copyBtn.addEventListener("click", function () { window.track("share_click", { mode: "picks" }); copyText(share, copyBtn); });
    return el("div", {}, [
      el("div", { class: "section-title", text: isFinal ? "Final week" : "Last week" }),
      el("div", { class: "banner " + cls }, [
        el("div", { class: "verdict display", text: s.total + " PTS" }),
        el("div", { class: "sub", text: sub }),
      ]),
      el("div", { class: "answers" }, rows),
      el("div", { class: "sweep", style: "margin:8px 0" }, [
        el("div", { class: "grid" }, [
          stat(String(s.total), "This week"),
          stat(String(seasonTotal()), "Season total", "var(--amber)"),
          stat(String(scoredWeeks().length), "Weeks scored"),
        ]),
      ]),
      el("div", { class: "section-title", text: "Share it" }),
      el("div", { class: "sharebox", text: share }),
      copyBtn,
    ]);
  }
  function seasonRows(weeks) {
    var rows = weeks.map(function (w) {
      return el("div", { class: "ans" }, [
        el("span", { text: trackName(w.race) }),
        el("span", { class: "r", text: w.score.total + " pts" }),
      ]);
    });
    return el("div", {}, [
      el("div", { class: "section-title", text: "Your season" }),
      el("div", { class: "answers" }, rows),
    ]);
  }

  function render() {
    var race = currentRace();
    var weeks = scoredWeeks();
    var last = weeks.length ? weeks[weeks.length - 1] : null;
    var parts = [el("div", { class: "checker" })];
    if (race) {
      parts.push(raceHeader(race));
      parts.push(isLocked(race) ? lockedPanel(race) : pickPanel(race));
    } else {
      parts.push(el("div", { class: "lede", style: "margin-top:10px", text: "The playoffs are done. Season total below. See you at the 500." }));
    }
    if (last) parts.push(scoreCard(last, !race));
    if (weeks.length > 1) parts.push(seasonRows(weeks));
    var MISSION = window.__LINEUP_MISSION__;
    if (MISSION && MISSION.buildNav) {
      parts.push(el("div", { class: "stack", style: "gap:6px;margin-top:12px" }, MISSION.buildNav("picks", { skipShare: true })));
    }
    parts.push(el("div", { class: "actions", style: "margin-top:10px" }, [
      el("button", { class: "btn ghost", text: "Back to games", onClick: function () { clearTimers(); if (window.__HUB__) window.__HUB__.home(); } }),
    ]));
    setScreen.apply(null, parts);
  }

  // Hub tile status line. Kept here so the schedule logic has one owner.
  window.__PICKS_INFO__ = function () {
    var race = currentRace();
    var weeks = scoredWeeks();
    var total = seasonTotal();
    if (!race) {
      return { stat: weeks.length ? "Season total: " + total + " pts" : "Playoffs complete", played: false, hasRace: false, railDone: true };
    }
    var p = picksFor(race);
    if (!isLocked(race)) {
      var lockTxt = race.startUtc ? "locks " + fmtET(lockMs(race)) : "locks " + race.raceDate + " 00:00 UTC";
      return { stat: trackName(race) + " " + lockTxt, played: isComplete(p), hasRace: true, railDone: isComplete(p) };
    }
    var last = weeks.length ? weeks[weeks.length - 1] : null;
    if (last) return { stat: "This week: " + last.score.total + " pts · Season: " + total, played: true, hasRace: true, railDone: true };
    return { stat: trackName(race) + " is locked. Results Monday morning.", played: !!p, hasRace: true, railDone: true };
  };

  window.__PICKS_MODE__ = {
    enter: function () {
      refreshServices();
      if (window.__LINEUP_NAV__) window.__LINEUP_NAV__.setHash("picks");
      App.root = document.getElementById("app");
      window.track("game_start", { mode: "picks" });
      render();
      if (RULES) RULES.maybeShow("picks");
    },
    leave: function () { clearTimers(); },
  };
})();
</script>

<script>
(function () {

/* =========================================================================

  '<svg class="lineup-logo" viewBox="0 0 356 120" role="img" aria-label="The Lineup">' +

var DEV = /[?&]dev=1/.test(location.search);

var CANON = window.__LINEUP_CANON__ || { name: function (s) { return String(s); }, short: function (s, d) { return d || String(s); } };

// The hub owns the persisted keys, so it runs the launch-build (v2) migration
// on boot: any v2 key is copied forward to v3 if the v3 key is absent, so no
// streak, best, or in-progress grid is lost across the version bump.
var DATA_VERSION = window.__LINEUP_DATA_VERSION__ || 6;
var NS = window.__LINEUP_NS__ || ("lineupHub:v" + DATA_VERSION + ":");
var LS = {
  grid: NS + "grid:",               // + UTC day key
  streakBest: NS + "streakBest",    // Free play best (unchanged)
  streakToday: NS + "streakToday:", // + UTC day key (Free play today best)
  lastMode: NS + "lastMode",
  gridHistory: NS + "gridHistory",  // daily grid played-days {day:{score}}
  gridArchive: NS + "gridArchive",  // archive grid plays {day:{score}}, kept apart
  ladderHistory: NS + "ladderHistory", // official daily ladder results {day:{rung}}
  crosseraStats: NS + "crosseraStats", // {played, wins, sumTotal, sumBench}
  crosseraDaily: NS + "crosseraDaily", // official daily cross-era results {day:{...}}
