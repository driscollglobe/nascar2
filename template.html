};

// Phase Four QA gate. Solution-capable inspection hooks (window.__GRID_DEBUG__,
// window.__CROSSERA__ and its solver/generator accessors) are attached ONLY when
// this is true, so a normal public build (no flag) exposes no path to a current
// or future day's answers. verify.js and make-manifest.js set a global LINEUP_QA
// in their sandbox before evaluating the scripts, so the harnesses keep working.
var QA = DEV || !!(window.LINEUP_QA || window.__LINEUP_QA__);

// Curated launch week (Sep 2 to 8, 2026). For those seven UTC days the grid uses
// a pinned candidate seed and difficulty instead of the date-derived pair, so a
// welcoming opener and a tuned week greet new players. Selected mechanically from
// a pool of 1200 valid generated grids (see gen-launch-seeds and check J); zero
// hand-authored answers, fully deterministic, every existing invariant held.
// Days after Sep 8 use the normal date-derived path unchanged.
var LAUNCH_WEEK_SEEDS = {
  // Re-selected mechanically after the beta clue-pool expansion shifted the
  // date-seed grids (same 1200-grid pool, same per-day criteria; see CHANGELOG).
  "2026-09-02": { seed: "lw|4", diff: "easy" },     // welcoming: counts [5,5,6,22,30,30,34,54,58] min 5, median 30, twos 0
  "2026-09-03": { seed: "lw|0", diff: "standard" }, // standard: counts [2,4,5,7,8,10,16,30,35] min 2, median 8, twos 1
  "2026-09-04": { seed: "lw|1", diff: "standard" }, // standard: counts [2,3,3,4,6,7,55,63,74] min 2, median 6, twos 1
  "2026-09-05": { seed: "lw|5", diff: "standard" }, // standard: counts [4,4,4,5,9,10,15,20,22] min 4, median 9, twos 0
  "2026-09-06": { seed: "lw|7", diff: "standard" }, // standard: counts [2,3,4,7,8,11,16,30,37] min 2, median 8, twos 1
  "2026-09-07": { seed: "lw|2", diff: "hard" },     // hard: counts [2,2,3,3,3,6,11,22,31] min 2, median 3, twos 2
  "2026-09-08": { seed: "lw|5", diff: "hard" },     // hard: counts [2,3,3,3,3,4,11,15,29] min 2, median 3, twos 1
};
// The (seed, theme, difficulty) triple the live grid uses for a given UTC day.
// Launch-week days override seed and difficulty; every other day is date-derived
// and weekday-weighted exactly as before. One source of truth for the client and
// (via the QA hook) the verifier and manifest generator.
function gridPlanForDay(dk) {
  var theme = THEME.forDay(dk);
  var lw = LAUNCH_WEEK_SEEDS[dk];
  if (lw) return { seed: lw.seed, theme: theme, difficulty: lw.diff, launch: true };
  return { seed: dk, theme: theme, difficulty: WEEKDAY.forDay(dk), launch: false };
}

// One-time forward migration of older-namespace keys. Copies any key from a
// prior version to its v6 equivalent when the v6 key is absent, newest source
// first so nothing is lost and nothing older overwrites something newer. Covers
// v2 and v3 in one pass, so a device on any prior build migrates cleanly.
(function migrateStorage() {
  try {
    if (!window.localStorage) return;
    ["lineupHub:v5:", "lineupHub:v4:", "lineupHub:v3:", "lineupHub:v2:"].forEach(function (oldPrefix) {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(oldPrefix) === 0) keys.push(k);
      }
      keys.forEach(function (k) {
        var nk = NS + k.slice(oldPrefix.length);
        if (localStorage.getItem(nk) === null) {
          var v = localStorage.getItem(k);
          if (v !== null) localStorage.setItem(nk, v);
        }
      });
    });
  } catch (e) {}
})();

// Grid epoch: Grid #1 is September 2, 2026 (UTC). The public counter reads 1
// on launch day and increments each UTC day after. Earlier UTC days are
// reachable only through the ?date= debug param and never below number 1.
var EPOCH_UTC = Date.UTC(2026, 8, 2);

/* ---------------- tiny helpers (same shapes as the draft engine) ---------------- */
function hashString(str) {
  var h = 2166136261 >>> 0;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }

}

}

    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  }

  for (var i = 0; i < kids.length; i++) {
    var c = kids[i];
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

}

  for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
  return parent;
}
// The one daily rollover for the whole hub. Everything daily (the Grid's
// day, Streak's today-best chip, any future daily) keys off this single UTC
// calendar day, so every player rolls over at the same instant, 00:00 UTC,
// no matter their timezone. ?date=YYYY-MM-DD overrides "today" for past-day
// debugging; it changes the seed and the counter but not real time.
// Day rollover delegates to the shared source so the hub and the Cross-Era
// closure can never disagree about "today".
var DAY = window.__LINEUP_DAY__ || {
  ms: function () { var d = new Date(); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); },
  key: function () { var d = new Date(); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); }
};
function todayUTCms() { return DAY.ms(); }
function dayKey() { return DAY.key(); }
function gridNumber() {

/* =========================================================================

   countdown shows the shared UTC reset, and deep links open a game directly.

/* ---------------- reset countdown (shared UTC rollover) ----------------
   Result screens and the hub footer show a live "New games in HH:MM:SS" to the

// Returns a node that updates itself. Under ?date= preview there is no real

/* =========================================================================
   Daily Grid data: MSS-verified facts (window.__GRID_FACTS__, 265 drivers

function surname(name) {

  while (t.length > 1 && /^(II|III|IV|V)$/i.test(t[t.length - 1])) t.pop();
  var last = t[t.length - 1];

/* ---------------- clue pool (built from MSS fields only) ----------------
   FACTUAL-INTEGRITY AUDIT (see CHANGELOG). Every clue carries an evidential
   basis and a claim form so the verifier can enforce the safety rules:
     basis: VERIFIED-COMPLETE  a field with a proven completeness gate
            POSITIVE-EVIDENCE  presence proven, absence NOT (row-counted
                               fields that can lack a venue or a team)
            DERIVED            computed from the above
     form:  positive           a presence/membership claim (safe on any basis)
            min-threshold       "N or more" (safe on any basis: true value can
                               only be higher, so a label is always true)
            era-safe            "started before Y" style (safe)
            negative            "never / did not" (PERMITTED ONLY on
                               VERIFIED-COMPLETE; verify.js check L enforces)

/* =========================================================================

   - Facts are MSS-verified (no hand-entered seed); pool is 265 drivers.
   - Full-grid backtracking guarantee: every served grid has a complete

   - Cells show the dataset display name (K. Schrader, Ku. Busch), routed
     through the canonical name table at render time.

     surnames always require an explicit tap.

     and no fail state. The day finishes at 9/9 or when the player taps Reveal.
   - Grid, Streak, and any future daily share ONE UTC day key (dayKey) and a
     UTC grid number off the September 2, 2026 epoch.
   - Every resolved guess is logged to localStorage (capped at 500) for the

var Grid = null; // live state

  var current = 0;
  var anchor = playedToday ? 0 : (playedYesterday ? 1 : -1);

    var i = anchor;

    if (run > longest) longest = run;

// Rarity tiers from the spec: 20%+ common, 5-20 solid, 1-5 deep cut, under 1%
// Garage Find. Fewer than 50 total attempts shows "Early answer" so small
// samples never read as fake precision.
function rarityInfo(count, total) {
  if (!total || total < 50) return { label: "Early answer", cls: "r-early", pct: null, garage: false, scored: false };
  var pct = (count / total) * 100;
  if (pct >= 20) return { label: Math.round(pct) + "% common", cls: "r-common", pct: pct, garage: false, scored: true };
  if (pct >= 5) return { label: Math.round(pct) + "% solid", cls: "r-solid", pct: pct, garage: false, scored: true };
  if (pct >= 1) return { label: pct.toFixed(1) + "% deep cut", cls: "r-deep", pct: pct, garage: false, scored: true };

    var r = cellRarity(i);

// Completed-grid reveal: keep the player's own correct boxes fixed and fill the

function revealSolution(g) {
  var used = {}; g.cells.forEach(function (c) { if (c) used[c.n] = 1; });
  var empties = [];
  for (var idx = 0; idx < 9; idx++) {
    if (g.cells[idx]) continue;
    var row = g.rows[Math.floor(idx / 3)], col = g.cols[idx % 3], list = [];
    for (var i = 0; i < GPOOL.length; i++) if (row.test(GPOOL[i]) && col.test(GPOOL[i])) list.push(GPOOL[i].n);

  setHubScreen("PAST GRIDS",
    el("div", { class: "checker thin" }),
    el("div", { class: "wordmark display", style: "font-size:20px;margin-top:6px", text: "Past grids" }),
    el("div", { class: "lede", style: "font-size:13px", text: "Every grid from #1 through yesterday. Archive plays are tracked separately and never touch your daily streak." }),
    items.length ? el("div", { class: "archive-list" }, items) : el("div", { class: "stats-empty", text: "No past grids yet." }),
    el("button", { class: "btn ghost", style: "margin-top:8px", text: "Back to today's grid", onClick: function () { renderGrid(); } })
  );
}

/* ---------------- cross-closure contract + boot ---------------- */
// The Cross-Era closure lives in its own script; the daily mission, navigation,
// rules, countdown, and its daily persistence are exposed here for it to use.
window.__LINEUP_MISSION__ = {
  status: missionStatus,
  next: nextMissionMode,
  goto: missionGoto,
  buildNav: buildMissionNav,
  crossDailyForDay: crossDailyForDay,
  crossDailySetIfAbsent: crossDailySetIfAbsent,
  crossEraDailyStreak: crossEraDailyStreak,
  markSweepIfComplete: markSweepIfComplete,
  sweepShareLine: sweepShareLine,
  offerAllegiance: offerAllegianceAfterGame,
};
window.__LINEUP_RULES__ = { show: showRulesOverlay, maybeShow: maybeShowRules, seen: rulesSeen };
window.__LINEUP_COUNTDOWN__ = { node: countdownNode, clearAll: clearAllCountdowns };
window.__LINEUP_SHARE_URL__ = shareURLFor;

// Solution-capable inspection hooks. Attached ONLY under the QA gate (dev=1 or
// a global LINEUP_QA), so a normal public build exposes no window path to a
// current or future day's answers. verify.js and make-manifest.js set LINEUP_QA
// in their sandbox, so the harnesses and the manifest generator are unaffected.
if (QA) {
  window.__GRID_DEBUG__ = { CLUES: CLUES, GPOOL: GPOOL, buildGrid: buildGrid, fullSolution: fullSolution, suggest: suggest, labelFor: labelFor, matchCount: matchCount, themeForDay: THEME.forDay, weekdayForDay: WEEKDAY.forDay, gridPlanForDay: gridPlanForDay, launchWeek: LAUNCH_WEEK_SEEDS, missFeedback: missFeedback, venue: VENUE, driverTrackCount: driverTrackCount, tracks: GF.tracks, computeGridScore: computeGridScore };
  if (window.__CROSSERA__) {
    window.__CROSSERA__.streakPool = SPOOL;
    window.__CROSSERA__.gridFacts = GF;
    window.__CROSSERA__.gridBuild = buildGrid;
    window.__CROSSERA__.gridSolve = fullSolution;
    window.__CROSSERA__.gridMatch = matchCount;
    window.__CROSSERA__.themeForDay = THEME.forDay;
    window.__CROSSERA__.weekdayForDay = WEEKDAY.forDay;
    window.__CROSSERA__.dailyLadder = dailyLadder;
    window.__CROSSERA__.gridPlanForDay = gridPlanForDay;
    window.__CROSSERA__.launchWeek = LAUNCH_WEEK_SEEDS;
  }
}
window.__HUB__ = { home: renderHub, allegiancePrompt: showAllegiancePrompt };

// Offer (never force) allegiance after a completed game, if the player has not
// chosen one and has not already been offered. Called from result screens.
function offerAllegianceAfterGame() {
  var a = ALLEGIANCE.get();
  if (a && (a.driver || a.prompted)) return;
  showAllegiancePrompt(false);
}

// Phase Four boot: new players land directly on the hub. The full-screen
// "Who's your driver?" wall is gone; allegiance is offered after the first
// completed game, from Stats, and from the hub chip. A sanitized deep link
// (#grid, #ladder, #draft) opens that game directly and composes with ?date;
// an unknown hash falls through to the hub.
(function boot() {
  var mode = currentHashMode();
  if (mode === "grid") { lsSet(LS.lastMode, "grid"); renderGrid(); return; }
  if (mode === "ladder") { lsSet(LS.lastMode, "streak"); renderStreak("ladder"); return; }
  if (mode === "crossera") { lsSet(LS.lastMode, "crossera"); if (window.__CROSSERA_MODE__) { window.__CROSSERA_MODE__.enter(); return; } }
  if (mode === "picks") { lsSet(LS.lastMode, "picks"); if (window.__PICKS_MODE__) { window.__PICKS_MODE__.enter(); return; } }
  if (mode === "hub") { renderHub(); return; }
  // Design pass: the Daily Grid is the landing view. The tile menu lives
  // behind the Games header button and the #hub deep link. First run gets
  // the welcome overlay on top of the grid.
  lsSet(LS.lastMode, "grid");
  if (!welcomeSeen()) {
    markRulesSeen("grid");
    renderGrid();
    showWelcome(false);
  } else {
    renderGrid();
  }
})();
})();
</script>
</body>
</html>
